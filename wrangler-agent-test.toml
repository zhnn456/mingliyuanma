# 模拟代理商 Worker 配置
# 注意：这是在同一账号下的独立 Worker，用于测试代理商流程

name = "agent-test"
main = ".open-next/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 代理商独立 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "mingli-agent-test"
database_id = "bc89ed85-3ebf-467b-ad12-a466c5d97544"

# 代理商独立 KV 命名空间
[[kv_namespaces]]
binding = "SESSIONS"
id = "df8b202121524117925f4ea16acd8b8a"

# 环境变量
