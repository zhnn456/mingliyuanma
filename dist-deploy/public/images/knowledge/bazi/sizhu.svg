<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" style="background:#faf6ef"><text x="380" y="36" text-anchor="middle" font-size="24" font-family="KaiTi, STKaiti, SimSun, serif" fill="#8b0000">四柱八字结构示例</text><text x="380" y="58" text-anchor="middle" font-size="13" font-family="KaiTi, STKaiti, SimSun, serif" fill="#888">年柱 · 月柱 · 日柱 · 时柱，每柱天干+地支，共八个字</text><rect x="60" y="80" width="150" height="44" rx="6" fill="#f5e9d0" stroke="#d4b878" stroke-width="1.5"/><text x="135" y="109" text-anchor="middle" font-size="16" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">年柱</text><rect x="60" y="132" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="135" y="166" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#8b0000">甲</text><rect x="60" y="192" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="135" y="226" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">子</text><text x="135" y="272" text-anchor="middle" font-size="12" font-family="KaiTi, STKaiti, SimSun, serif" fill="#888">2024 甲辰年</text><rect x="230" y="80" width="150" height="44" rx="6" fill="#f5e9d0" stroke="#d4b878" stroke-width="1.5"/><text x="305" y="109" text-anchor="middle" font-size="16" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">月柱</text><rect x="230" y="132" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="305" y="166" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#8b0000">丙</text><rect x="230" y="192" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="305" y="226" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">寅</text><text x="305" y="272" text-anchor="middle" font-size="12" font-family="KaiTi, STKaiti, SimSun, serif" fill="#888">2 月立春后</text><rect x="400" y="80" width="150" height="44" rx="6" fill="#f0dcc0" stroke="#b8860b" stroke-width="2.5"/><text x="475" y="109" text-anchor="middle" font-size="16" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">日柱</text><rect x="400" y="132" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="475" y="166" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#8b0000">戊</text><rect x="400" y="192" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="475" y="226" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">辰</text><text x="475" y="272" text-anchor="middle" font-size="12" font-family="KaiTi, STKaiti, SimSun, serif" fill="#888">出生当日</text><rect x="570" y="80" width="150" height="44" rx="6" fill="#f5e9d0" stroke="#d4b878" stroke-width="1.5"/><text x="645" y="109" text-anchor="middle" font-size="16" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">时柱</text><rect x="570" y="132" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="645" y="166" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#8b0000">庚</text><rect x="570" y="192" width="150" height="52" rx="6" fill="#fdf6e3" stroke="#d4b878"/><text x="645" y="226" text-anchor="middle" font-size="26" font-family="KaiTi, STKaiti, SimSun, serif" fill="#2d2d2d">申</text><text x="645" y="272" text-anchor="middle" font-size="12" font-family="KaiTi, STKaiti, SimSun, serif" fill="#888">出生时辰</text><text x="380" y="320" text-anchor="middle" font-size="12" font-family="KaiTi, STKaiti, SimSun, serif" fill="#999">日柱为"日主"，代表本人，是四柱分析的核心</text></svg>