name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cf-workers-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  WORKER_NAME: 'mingli-yuanma'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate knowledge base
        run: npm run generate:knowledge

      - name: Inject version number
        run: node scripts/version-inject.js

      - name: Build Next.js for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://bazi6.cc.cd' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: npx wrangler deploy --config wrangler.toml

      - name: Output deploy result
        run: |
          echo "✅ 部署完成"
          echo "🌐 https://${{ env.WORKER_NAME }}.workers.dev"
