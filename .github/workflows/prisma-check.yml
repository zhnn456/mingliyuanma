name: Prisma Schema Check

on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'

concurrency:
  group: prisma-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  schema-check:
    name: Schema 变更检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: 验证 Prisma Schema
        run: npx prisma validate

      - name: 检查迁移状态
        run: npx prisma migrate status || echo "⚠️  需要运行 npx prisma migrate dev"

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 同步 TypeScript 类型
        run: npm run sync:types

      - name: 检查生成类型是否被提交
        uses: actions/github-script@v7
        with:
          script: |
            const typesFile = 'src/types/index.ts';
            const { data: content } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: typesFile,
              ref: context.ref
            });
            const existingContent = Buffer.from(content.content, 'base64').toString();
            const fs = require('fs');
            const newContent = fs.readFileSync(typesFile, 'utf-8');
            
            if (existingContent !== newContent) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **类型定义需要更新**\n\n检测到 Prisma Schema 变更后，\`src/types/index.ts\` 需要同步更新。\n\n请运行：\n\`\`\`bash\nnpm run generate:types\n\`\`\``
              }).catch(() => {});
            }

  migration-plan:
    name: 迁移计划检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: 检测新迁移
        run: |
          if [ -d "prisma/migrations" ]; then
            echo "📋 当前迁移列表:"
            ls -la prisma/migrations/ 2>/dev/null || echo "无迁移"
          fi

      - name: 验证迁移 SQL
        if: success()
        run: |
          echo "📝 检查迁移 SQL 文件..."
          find prisma -name "*.sql" -type f 2>/dev/null | while read f; do
            echo "  - $f"
          done
