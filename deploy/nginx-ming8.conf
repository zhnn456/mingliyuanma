# 全局限流区域定义（必须在 http 块中，若此文件作为 server 块引入，请将下面两行移到 http 块）
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    server_name ming8.online www.ming8.online;

    # SSL 重定向（证书配置后取消注释）
    # return 301 https://$server_name$request_uri;

    # 每IP并发连接上限（防慢速连接占满）
    limit_conn conn_zone 20;

    # 登录/注册接口：严格限流（防爆破、防批量注册）
    location /api/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/user/(register|redeem-card)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 屏蔽常见敏感路径与恶意爬虫UA
    location ~* /\.(env|git|svn|DS_Store) {
        return 404;
    }
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|python-requests|scrapy|HttpClient)) {
        return 403;
    }

    location / {
        limit_req zone=general_zone burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传大小收紧（原50M过大，防大body慢速滥用）
    client_max_body_size 10M;
}
